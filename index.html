<style>
:root{--bg:#fff;--bg2:#f5f5f5;--bg3:#eee;--text:#111;--text2:#666;--text3:#999;--border:#e0e0e0;--acc:#000;--act:#fff;--g:#16a34a;--gbg:#f0fdf4;--gbr:#bbf7d0;--r:#dc2626;--rbg:#fef2f2;--rbr:#fecaca;--y:#d97706;--ybg:#fffbeb;--ybr:#fde68a;--b:#2563eb;--bbg:#eff6ff;--bbr:#bfdbfe;--rad:12px;--rads:8px;--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);}
@media(prefers-color-scheme:dark){:root{--bg:#0a0a0a;--bg2:#1a1a1a;--bg3:#2a2a2a;--text:#f0f0f0;--text2:#aaa;--text3:#666;--border:#2a2a2a;--gbg:#052e16;--rbg:#450a0a;--ybg:#422006;--bbg:#172554;}}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);padding-top:var(--st);}
#app{height:100vh;display:flex;flex-direction:column;}
.scr{display:none;flex:1;overflow-y:auto;padding:16px 16px calc(80px + var(--sb));}
.scr.on{display:block;}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--bg);border-top:1px solid var(--border);display:flex;padding-bottom:var(--sb);z-index:100;}
.nb{flex:1;padding:10px 4px 8px;background:none;border:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--text3);font-family:inherit;}
.nb.on{color:var(--text);}
.nb .ic{font-size:22px;}.nb .lb{font-size:10px;font-weight:500;}
/* Setup */
.setup{max-width:400px;margin:0 auto;padding:40px 0;text-align:center;}
.gbtn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:13px;background:#fff;border:1.5px solid #dadce0;border-radius:var(--rads);font-size:15px;font-weight:500;cursor:pointer;font-family:inherit;color:#3c4043;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.1);}
/* Cards & Buttons */
.card{background:var(--bg);border:1px solid var(--border);border-radius:var(--rad);padding:14px 16px;margin-bottom:10px;}
.card.gr{background:var(--gbg);border-color:var(--gbr);}
.card.re{background:var(--rbg);border-color:var(--rbr);}
.card.ye{background:var(--ybg);border-color:var(--ybr);}
.card.bl{background:var(--bbg);border-color:var(--bbr);}
.btn{padding:11px 16px;border-radius:var(--rads);border:1px solid var(--border);cursor:pointer;font-size:14px;font-weight:500;font-family:inherit;background:var(--bg2);color:var(--text);}
.btn:active{opacity:.7;}
.btn.pr{background:var(--acc);color:var(--act);border-color:var(--acc);}
.btn.wr{width:100%;text-align:center;}
.brow{display:flex;gap:8px;margin-bottom:10px;}
.brow .btn{flex:1;text-align:center;}
/* Flip card */
.fc{background:var(--bg);border:1px solid var(--border);border-radius:var(--rad);margin-bottom:10px;min-height:160px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center;-webkit-user-select:none;}
.fc .lb{font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:.07em;margin-bottom:8px;}
.fc .en{font-size:20px;font-weight:400;line-height:1.5;margin-bottom:6px;}
.fc .ko{font-size:15px;color:var(--text2);line-height:1.4;}
.fc .hi{font-size:12px;color:var(--text3);margin-top:8px;}
/* Audio bar */
.abar{background:var(--bg2);border:1px solid var(--border);border-radius:var(--rads);padding:10px 12px;margin-bottom:10px;}
.abrow{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.pbtn{width:40px;height:40px;border-radius:50%;background:var(--acc);color:var(--act);border:none;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.pbtn.st{background:var(--rbg);color:var(--r);border:1px solid var(--rbr);}
.spdr{display:flex;gap:4px;flex-wrap:wrap;}
.sb2{padding:4px 10px;border-radius:20px;border:1px solid var(--border);background:var(--bg);color:var(--text2);font-size:12px;cursor:pointer;font-family:inherit;}
.sb2.on{background:var(--acc);color:var(--act);border-color:var(--acc);}
/* Progress */
.pbar{height:6px;background:var(--bg3);border-radius:3px;overflow:hidden;margin-bottom:4px;}
.pfill{height:100%;background:var(--acc);border-radius:3px;transition:width .4s;}
.pfill.gn{background:var(--g);}
/* Stats */
.str{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px;}
.st2{background:var(--bg2);border-radius:var(--rads);padding:10px 8px;text-align:center;border:1px solid var(--border);}
.stn{font-size:20px;font-weight:600;}.stl{font-size:11px;color:var(--text3);margin-top:2px;}
/* Level map */
.li{display:flex;align-items:flex-start;gap:12px;padding:14px;border:1px solid var(--border);border-radius:var(--rad);margin-bottom:10px;cursor:pointer;background:var(--bg);}
.li:active{opacity:.8;}.li.lk{opacity:.4;cursor:not-allowed;}.li.dn{border-color:var(--gbr);background:var(--gbg);}.li.cu{border:2px solid var(--acc);}
/* Input */
.tinp{width:100%;padding:12px 14px;border:1px solid var(--border);border-radius:var(--rads);background:var(--bg2);color:var(--text);font-size:15px;font-family:inherit;}
.tinp:focus{outline:none;border-color:var(--acc);}
.mbtn{width:44px;height:44px;border-radius:50%;border:1px solid var(--border);cursor:pointer;background:var(--bg2);font-size:20px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.mbtn.re{background:var(--rbg);border-color:var(--rbr);animation:pulse .9s ease-in-out infinite;}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
/* Dialogue lines */
.dl{display:flex;gap:8px;align-items:flex-start;padding:8px 10px;border-radius:var(--rads);margin-bottom:3px;}
.dl.ac{background:var(--bbg);}.dl.mc{background:var(--ybg);}.dl.dn{opacity:.4;}.dl.wr{opacity:.75;}
.dl.hi-line{background:var(--ybg);border:1.5px solid var(--ybr);}
/* Review alert */
.ra{background:var(--ybg);border:1.5px solid var(--ybr);border-radius:var(--rad);padding:14px;margin-bottom:14px;}
/* Level clear */
.lc2{text-align:center;background:var(--gbg);border:1.5px solid var(--gbr);border-radius:var(--rad);padding:28px 20px;margin-bottom:12px;}
/* Misc */
.sp{display:inline-block;width:14px;height:14px;border:2px solid var(--border);border-top-color:var(--text);border-radius:50%;animation:spin .8s linear infinite;vertical-align:middle;}
@keyframes spin{to{transform:rotate(360deg)}}
.wav{display:flex;align-items:center;gap:2px;height:14px;}
.wav span{display:inline-block;width:3px;border-radius:2px;background:var(--act);animation:wav .6s ease-in-out infinite;}
.wav span:nth-child(2){animation-delay:.1s;}.wav span:nth-child(3){animation-delay:.2s;}.wav span:nth-child(4){animation-delay:.3s;}
@keyframes wav{0%,100%{height:3px}50%{height:12px}}
.dbar{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:var(--rads);border:1px solid var(--border);background:var(--bg2);margin-bottom:12px;font-size:12px;}
.dd{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.dd.ok{background:var(--g);}.dd.sy{background:var(--y);animation:blink 1s ease-in-out infinite;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
/* Chapter chips */
.ch-scroll{display:flex;gap:5px;overflow-x:auto;padding-bottom:6px;margin-bottom:10px;-webkit-overflow-scrolling:touch;}
.ch-chip{padding:5px 12px;border-radius:20px;border:1px solid var(--border);background:var(--bg);color:var(--text2);font-size:12px;white-space:nowrap;cursor:pointer;font-family:inherit;flex-shrink:0;}
.ch-chip.on{background:var(--acc);color:var(--act);border-color:var(--acc);}
/* Review topic card */
.topic-card{background:var(--bbg);border:1.5px solid var(--bbr);border-radius:var(--rad);padding:20px;margin-bottom:10px;text-align:center;cursor:pointer;}
.topic-ko{font-size:18px;font-weight:700;margin-bottom:6px;color:var(--text);}
.topic-sub{font-size:13px;color:var(--b);}
.topic-hint{font-size:12px;color:var(--text3);margin-top:8px;}
/* Check list for review */
.chk-line{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--border);border-radius:var(--rads);margin-bottom:6px;cursor:pointer;background:var(--bg);}
.chk-line.checked{background:var(--rbg);border-color:var(--rbr);}
.chk-box{width:22px;height:22px;border-radius:6px;border:1.5px solid var(--border);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:13px;}
.chk-line.checked .chk-box{background:var(--r);border-color:var(--r);color:#fff;}
.chk-text{font-size:14px;flex:1;line-height:1.4;}
.chk-spk{font-size:15px;background:none;border:none;cursor:pointer;flex-shrink:0;}
/* Ebbinghaus badge */
.ebb-badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600;}
.ebb-badge.d1{background:var(--ybg);color:var(--y);}
.ebb-badge.d3{background:var(--bbg);color:var(--b);}
.ebb-badge.d7{background:#fdf4ff;color:#9333ea;}
.ebb-badge.d30{background:var(--gbg);color:var(--g);}
/* Content type tabs — english-study-update-2026-08 */
.section-tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--rad);padding:5px;margin-bottom:14px;}
.section-tab{min-height:42px;border:0;border-radius:var(--rads);background:transparent;color:var(--text2);font-size:13px;font-weight:650;font-family:inherit;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;}
.section-tab.on{background:var(--acc);color:var(--act);box-shadow:0 1px 3px rgba(0,0,0,.14);}
.section-count{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--bg3);color:var(--text2);font-size:10px;font-weight:700;}
.section-tab.on .section-count{background:rgba(255,255,255,.2);color:inherit;}
.book-empty{border:1px dashed var(--border);border-radius:var(--rad);padding:30px 18px;text-align:center;background:var(--bg2);}
.book-empty .be-ic{font-size:34px;margin-bottom:8px;}
.book-empty .be-title{font-size:15px;font-weight:700;margin-bottom:5px;}
.book-empty .be-sub{font-size:12px;color:var(--text2);line-height:1.65;}
.book-word-card{padding:14px 15px;}
.book-word-head{display:flex;align-items:flex-start;gap:10px;margin-bottom:8px;}
.book-word-en{font-size:19px;font-weight:700;line-height:1.25;}
.book-word-ko{font-size:13px;color:var(--text2);margin-top:2px;}
.book-example-ko{font-size:13px;color:var(--text2);line-height:1.55;margin-bottom:4px;}
</style>
</head>

function allChapters(){return CHAPTERS.concat(DB.customChapters||[]);}
function getCh(id){var a=allChapters();for(var i=0;i<a.length;i++)if(a[i].id===id)return a[i];return null;}
var CLIENT_ID=window.GOOGLE_CLIENT_ID||'683820382727-0d15m80j5raqi4gpee5hsrsh9tn3nl8l.apps.googleusercontent.com';

var gTok=null,fId=null,dSt='of';
var td=function(){return new Date().toISOString().split('T')[0];};
var addD=function(d,n){var dt=new Date(d);dt.setDate(dt.getDate()+n);return dt.toISOString().split('T')[0];};

// ── PERSIST ──
function saveLoc(){try{localStorage.setItem('esl_v3',JSON.stringify(DB));}catch(e){}}
function applyLoadedData(d){
  if(!d)return;
  if(d.studiedChapters)DB.studiedChapters=d.studiedChapters;
  if(typeof d.xp==='number')DB.xp=d.xp;
  if(typeof d.streak==='number')DB.streak=d.streak;
  if(typeof d.lastStudy==='string')DB.lastStudy=d.lastStudy;
  if(Array.isArray(d.customChapters))DB.customChapters=d.customChapters;
  if(Array.isArray(d.bookWords))DB.bookWords=d.bookWords;
  if(Array.isArray(d.books))DB.books=d.books;
  if(typeof d.speechRate==='number'){
    DB.speechRate=Math.max(.5,Math.min(2,d.speechRate));
    spd=DB.speechRate;
  }
}
function loadLoc(){try{var s=localStorage.getItem('esl_v3');if(s)applyLoadedData(JSON.parse(s));}catch(e){}}

// ── GOOGLE DRIVE ──
function signIn(){
  if(!CLIENT_ID){alert('Client ID가 없어요.');return;}
  google.accounts.oauth2.initTokenClient({client_id:CLIENT_ID,scope:SCOPES,callback:function(r){
    if(r.error){alert('로그인 실패: '+r.error);return;}
    gTok=r.access_token;dSt='sy';initApp();
  }}).requestAccessToken();
}
async function dReq(m,u,b,ct){var h={'Authorization':'Bearer '+gTok};if(ct)h['Content-Type']=ct;var o={method:m,headers:h};if(b)o.body=b;return fetch(u,o);}
async function dLoad(){
  dSt='sy';rdBar();
  try{
    var r=await dReq('GET',"https://www.googleapis.com/drive/v3/files?q=name%3D'english_study_v3.json'%20and%20trashed%3Dfalse&fields=files(id)");
    var d=await r.json();
    if(d.files&&d.files.length>0){
      fId=d.files[0].id;
      var r2=await dReq('GET','https://www.googleapis.com/drive/v3/files/'+fId+'?alt=media');
      var data=await r2.json();
      applyLoadedData(data);
    }
    dSt='ok';
  }catch(e){dSt='er';}
  rdBar();rend();
}

function sched(){if(svT)clearTimeout(svT);svT=setTimeout(dSave,1500);}

}

// ── STUDY TRACKING ──
function markStudied(chId){
  var today=td();
  var entry={studiedDate:today,nextReviews:EBB_DAYS.map(function(d){return addD(today,d);}),reviewsDone:[false,false,false,false],missedLines:[]};
  DB.studiedChapters[chId]=entry;
  DB.xp+=20;updStr();sched();
}
function getReviewsDue(){
  var due=[];
  var today=td();
  Object.keys(DB.studiedChapters).forEach(function(cid){
    var entry=DB.studiedChapters[cid];
    entry.nextReviews.forEach(function(date,i){
      if(!entry.reviewsDone[i]&&date<=today){
        due.push({chId:parseInt(cid),reviewIdx:i,date:date});
      }
    });
  });
  return due;
}
function markReviewDone(chId,reviewIdx){

function saveMissedLines(chId,lines){

}

function updStr(){var t=td();if(DB.lastStudy===t)return;if(DB.lastStudy===addD(t,-1))DB.streak++;else if(DB.lastStudy!==t)DB.streak=1;DB.lastStudy=t;}

// ── CUSTOM DIALOGUES (사용자가 직접 추가) ──
// eslfast.com처럼 "A: ..." / "B: ..." 형식으로 붙여넣으면 자동으로 문장을 나눠줌.
// A:/B: 표시가 없으면 한 줄씩 번갈아가며 A,B로 자동 배정.
function parseDlg(text){
  var raw=String(text||'').split(/\r?\n/).map(function(l){return l.trim();}).filter(Boolean);
  var out=[],toggle='A';
  raw.forEach(function(l){
    var m=l.match(/^([AB])\s*[:.\-–)]\s*(.+)$/i);
    if(m){
      var spk=m[1].toUpperCase();
      out.push({s:spk,e:m[2].trim()});
      toggle=spk==='A'?'B':'A';
    } else {
      out.push({s:toggle,e:l});
      toggle=toggle==='A'?'B':'A';
    }
  });
  return out;
}
function previewAdd(){
  var raw=document.getElementById('addRaw').value;
  var dlg=parseDlg(raw);
  var box=document.getElementById('addPreview');
  if(!box)return;
  if(dlg.length===0){box.innerHTML='<div style="font-size:12px;color:var(--text3)">대화 내용을 붙여넣으면 여기에 미리보기가 나와요.</div>';return;}
  var h='<div style="font-size:11px;font-weight:600;color:var(--text2);margin-bottom:6px">미리보기 · '+dlg.length+'문장</div>';
  dlg.forEach(function(l){
    h+='<div style="display:flex;gap:6px;padding:3px 0"><span style="font-size:12px;font-weight:600;min-width:16px;color:'+(l.s==='A'?'var(--b)':'var(--y)')+'">'+l.s+'</span><span style="font-size:13px">'+esc(l.e)+'</span></div>';
  });
  box.innerHTML=h;
}

  DB.customChapters=DB.customChapters||[];

// ── AUDIO ──
var syn=window.speechSynthesis,SR=null,lAct=false,lN=0,spd=DB.speechRate||0.75;
var loopText='',loopToken=0,loopTimer=null;
try{var RC=window.SpeechRecognition||window.webkitSpeechRecognition;if(RC){SR=new RC();SR.lang='en-US';SR.continuous=false;SR.interimResults=false;}}catch(e){}
function makeUtterance(t,r){
  var u=new SpeechSynthesisUtterance(t);
  u.lang='en-US';u.rate=r||1;u.pitch=1;
  return u;
}
function spk(t,r,cb){
  stopLoop(false);
  var u=makeUtterance(t,r);
  u.onend=function(){if(cb)setTimeout(cb,500);};
  u.onerror=function(e){
    if(e&&(e.error==='canceled'||e.error==='interrupted'))return;
    if(cb)setTimeout(cb,500);
  };
  if(syn.paused)syn.resume();
  syn.speak(u);
}
function sLoop(t){
  if(!t)return;
  stopLoop(false);
  lAct=true;lN=0;loopText=t;loopToken++;
  var token=loopToken;
  G.pl=true;G.rn=0;rend();
  function lp(){
    if(!lAct||token!==loopToken)return;
    lN++;G.rn=lN;rend();
    var u=makeUtterance(loopText,spd);
    u.onend=function(){
      if(!lAct||token!==loopToken)return;
      loopTimer=setTimeout(lp,500);
    };
    u.onerror=function(e){
      if(e&&(e.error==='canceled'||e.error==='interrupted'))return;
      if(token===loopToken){stopLoop(false);rend();}
    };
    if(syn.paused)syn.resume();
    syn.speak(u);
  }
  lp();
}
function stopLoop(redraw){
  lAct=false;loopToken++;loopText='';
  if(loopTimer){clearTimeout(loopTimer);loopTimer=null;}
  syn.cancel();G.pl=false;G.rn=0;
  if(redraw)rend();
}
function setSpeed(v){
  var next=parseFloat(v);
  if(!isFinite(next))return;
  next=Math.max(.5,Math.min(2,next));
  spd=next;DB.speechRate=next;sched();
  if(lAct&&loopText){var t=loopText;sLoop(t);}
  else rend();
}
function startMic(cb){
  if(!SR){alert('마이크는 Chrome에서만 지원해요.');return;}
  SR.onresult=function(e){var t='';for(var i=e.resultIndex;i<e.results.length;i++)if(e.results[i].isFinal)t+=e.results[i][0].transcript;if(t&&cb)cb(t.trim());};
  SR.onerror=function(){G.isRec=false;G.convRec=false;rend();};
  SR.onend=function(){G.isRec=false;G.convRec=false;rend();};
  SR.start();
}

function sim(a,b){
  a=a.toLowerCase().replace(/[.,!?'"]/g,'').trim();
  b=b.toLowerCase().replace(/[.,!?'"]/g,'').trim();
  if(a===b)return 1;
  var aw=a.split(/\s+/),bw=b.split(/\s+/),m=0;
  bw.forEach(function(w){if(aw.indexOf(w)>=0)m++;});
  return m/Math.max(bw.length,1);
}

function getAIRole(role){return role==='A'?'B':'A';}

function startConv(role,lines,isReview){
  var cl=lines.map(function(l){return{s:l.s,e:l.e,status:'pending',userSaid:null,fix:null};});
  if(isReview){
    G.revConvRole=role;G.revConvStarted=true;G.revConvLines=cl;
    G.revConvIdx=0;G.revConvWait=false;G.revConvDone=false;
    G.revConvCorrect=0;G.revConvTotal=0;
  } else {
    G.convRole=role;G.convStarted=true;G.convLines=cl;
    G.convIdx=0;G.convWaitUser=false;G.convDone=false;
    G.convCorrect=0;G.convTotal=0;
  }
  rend();setTimeout(function(){runLine(isReview);},300);
}

function runLine(isReview){
  var lines=isReview?G.revConvLines:G.convLines;
  var idx=isReview?G.revConvIdx:G.convIdx;
  var role=isReview?G.revConvRole:G.convRole;
  if(idx>=lines.length){endConv(isReview);return;}
  rend();
  var line=lines[idx];
  if(line.s===getAIRole(role)){
    line.status='ai-cur';rend();
    spk(line.e,spd,function(){
      line.status='dn';
      if(isReview)G.revConvIdx++;else G.convIdx++;
      runLine(isReview);
    });
  } else {
    line.status='me-cur';
    if(isReview)G.revConvWait=true;else G.convWaitUser=true;
    rend();
  }
}

function handleUserLine(txt,isReview){
  var lines=isReview?G.revConvLines:G.convLines;
  var idx=isReview?G.revConvIdx:G.convIdx;
  var ok=sim(txt,lines[idx].e)>=0.72;
  lines[idx].status=ok?'dn':'wr';
  lines[idx].userSaid=txt;lines[idx].fix=ok?null:lines[idx].e;
  if(isReview){G.revConvWait=false;G.revConvCorrect+=ok?1:0;G.revConvTotal++;}
  else{G.convWaitUser=false;G.convCorrect+=ok?1:0;G.convTotal++;}
  var advance=function(){if(isReview)G.revConvIdx++;else G.convIdx++;runLine(isReview);};
  if(!ok)spk(lines[idx].e,spd,function(){setTimeout(advance,200);});
  else{DB.xp+=5;setTimeout(advance,200);}
  rend();
}

// Review roleplay: user speaks their own line out loud (no STT grading).
// Pressing the button just advances so the AI's line plays via TTS.
function advanceReviewLine(){
  var idx=G.revConvIdx;
  var line=G.revConvLines[idx];
  line.status='dn';line.userSaid=null;line.fix=null;
  G.revConvWait=false;G.revConvCorrect+=1;G.revConvTotal++;
  DB.xp+=5;
  G.revConvIdx++;
  setTimeout(function(){runLine(true);},150);
  rend();
}

// Study roleplay: same flow as review — user speaks their own line out loud
// (no STT grading). Pressing the button just advances so the AI's line plays via TTS.
function advanceStudyLine(){
  var idx=G.convIdx;
  var line=G.convLines[idx];
  line.status='dn';line.userSaid=null;line.fix=null;
  G.convWaitUser=false;G.convCorrect+=1;G.convTotal++;
  DB.xp+=5;
  G.convIdx++;
  setTimeout(function(){runLine(false);},150);
  rend();
}

function endConv(isReview){
  if(isReview){
    G.revConvDone=true;G.revConvWait=false;
    var pct=G.revConvTotal>0?Math.round(G.revConvCorrect/G.revConvTotal*100):0;
    if(pct>=90){G.revStep=5;markReviewDone(G.reviewItem.chId,G.reviewItem.reviewIdx);DB.xp+=20;}
    rend();
  } else {
    G.convDone=true;G.convWaitUser=false;
    var p=G.convTotal>0?Math.round(G.convCorrect/G.convTotal*100):0;
    G.convEval={pct:p,ready:p>=90};
    if(p>=90){DB.xp+=30;markStudied(G.studyChId);}
    sched();rend();
  }
}

async function handlePdfFile(input){
  var file=input.files&&input.files[0];
  if(!file)return;
  G.pdfBusy=true;rend();
  try{
    if(window.pdfjsLib&&pdfjsLib.GlobalWorkerOptions)pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    var buf=await file.arrayBuffer();
    var doc=await pdfjsLib.getDocument({data:buf}).promise;
    var full='';
    for(var p=1;p<=doc.numPages;p++){
      var page=await doc.getPage(p);
      var tc=await page.getTextContent();
      full+=tc.items.map(function(it){return it.str;}).join(' ')+' ';
    }
    var raw=full.replace(/\s+/g,' ').trim();
    var sentences=raw.split(/(?<=[.!?])\s+(?=[A-Z"'])/).map(function(s){return s.trim();}).filter(function(s){return s.length>3&&/[a-zA-Z]/.test(s);});
    if(sentences.length===0){
      alert('이 PDF에서 텍스트를 찾지 못했어요 (스캔 이미지 PDF일 수 있어요).');
    }else{
      var book={id:'bk'+Date.now()+Math.floor(Math.random()*1000),title:file.name.replace(/\.pdf$/i,''),sentences:sentences,savedAt:new Date().toISOString()};
      DB.books=DB.books||[];
      DB.books.push(book);
      sched();
      G.currentBookId=book.id;
      G.bookScreen='read';
    }
  }catch(e){
    alert('PDF를 읽는 중 문제가 발생했어요. 다른 PDF로 다시 시도해보세요.');
  }
  G.pdfBusy=false;
  input.value='';
  rend();
}

function aBarH(t){

      h+='<div style="font-size:13px;color:var(--text2)">새 강의를 학습하면 복습이 자동 예약돼요.</div></div>';
    } else {
      h+='<div style="font-size:13px;font-weight:600;color:var(--text2);margin-bottom:10px">오늘 복습할 강의 '+due.length+'개</div>';
      due.forEach(function(item){
        var ch=getCh(item.chId);
        h+='<div class="card" style="cursor:pointer" onclick="G.reviewItem='+JSON.stringify(item)+';G.revStep=1;G.revRevealed=false;G.revChecked=[];rend()">';
        h+='<div style="display:flex;align-items:center;gap:10px">';
        h+='<span class="ebb-badge '+EBB_COLORS[item.reviewIdx]+'">'+EBB_LABELS[item.reviewIdx]+'</span>';
        h+='<div style="flex:1"><div style="font-size:14px;font-weight:600">'+esc(ch.title)+'</div>';
        h+='<div style="font-size:12px;color:var(--text2);margin-top:2px">'+esc(ch.en_title)+'</div></div>';
        h+='<span style="font-size:18px">→</span></div></div>';
      });
    }

    // All studied chapters status — chapters that finished all 4 reviews (incl. 30-day)
    // are hidden by default and can be revealed with a toggle.
    var studied=Object.keys(DB.studiedChapters);
    if(studied.length>0){
      var activeIds=[],doneIds=[];
      studied.forEach(function(cid){
        if(!getCh(parseInt(cid)))return;
        var allDone=DB.studiedChapters[cid].reviewsDone.every(Boolean);
        (allDone?doneIds:activeIds).push(cid);
      });
      h+='<div style="font-size:13px;font-weight:600;color:var(--text2);margin:16px 0 10px;text-transform:uppercase;letter-spacing:.05em">학습한 강의 현황</div>';
      var renderRow=function(cid){
        var ch=getCh(parseInt(cid));
        var entry=DB.studiedChapters[cid];
        var r='<div class="card" style="margin-bottom:6px">';
        r+='<div style="font-size:13px;font-weight:600;margin-bottom:6px">'+esc(ch.title)+'</div>';
        r+='<div style="display:flex;gap:5px">';
        EBB_LABELS.forEach(function(l,i){
          var done=entry.reviewsDone[i];
          r+='<div style="flex:1;text-align:center;padding:5px 2px;border-radius:var(--rads);background:'+(done?'var(--gbg)':'var(--bg2)')+';border:1px solid '+(done?'var(--gbr)':'var(--border)')+'"><div style="font-size:10px;color:'+(done?'var(--g)':'var(--text3)')+'">'+l+'</div><div style="font-size:14px">'+(done?'✓':'○')+'</div></div>';
        });
        r+='</div></div>';
        return r;
      };
      if(activeIds.length===0&&doneIds.length>0){
        h+='<div style="font-size:12px;color:var(--text2);margin-bottom:8px">진행 중인 강의가 없어요. 모두 4단계 복습을 완료했어요!</div>';
      }
      activeIds.forEach(function(cid){h+=renderRow(cid);});
      if(doneIds.length>0){
        h+='<button class="btn wr" style="margin-top:2px;margin-bottom:6px" onclick="G.revShowDone=!G.revShowDone;rend()">'+(G.revShowDone?'▲ 완료된 강의 숨기기':'▼ 1달 복습까지 완료한 강의 '+doneIds.length+'개 보기')+'</button>';
        if(G.revShowDone){doneIds.forEach(function(cid){h+=renderRow(cid);});}
      }
    }

    document.getElementById('src').innerHTML=h;
    return;
  }

  // Review steps
  var ch=getCh(G.reviewItem.chId);
  var lines=ch.dlg;
  var reviewIdx=G.reviewItem.reviewIdx;

  h+='<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">';
  h+='<div><div style="font-size:15px;font-weight:700">'+esc(ch.title)+'</div>';
  h+='<span class="ebb-badge '+EBB_COLORS[reviewIdx]+'">'+EBB_LABELS[reviewIdx]+'</span></div>';
  h+='<button class="btn" onclick="stopLoop();G.reviewItem=null;G.revStep=0;rend()">← 목록</button></div>';

  // Step indicator
  h+='<div style="display:flex;gap:4px;margin-bottom:12px">';
  [{n:1,l:'주제확인'},{n:2,l:'문장체크'},{n:3,l:'반복연습'},{n:4,l:'롤플레이'},{n:5,l:'완료'}].forEach(function(s){
    h+='<div style="flex:1;padding:6px 2px;text-align:center;border-radius:var(--rads);font-size:10px;background:'+(G.revStep===s.n?'var(--acc)':G.revStep>s.n?'var(--gbg)':'var(--bg2)')+';color:'+(G.revStep===s.n?'var(--act)':G.revStep>s.n?'var(--g)':'var(--text3)')+';border:1px solid '+(G.revStep===s.n?'var(--acc)':G.revStep>s.n?'var(--gbr)':'var(--border)')+'">'+s.l+'</div>';
  });
  h+='</div>';

  // STEP 1: Topic card
  if(G.revStep===1){
    h+='<div class="topic-card" onclick="G.revRevealed=true;rend()">';
    h+='<div class="topic-ko">'+esc(ch.title)+'</div>';
    if(!G.revRevealed){
      h+='<div class="topic-sub">이 주제의 대화를 기억해보세요</div>';
      h+='<div class="topic-hint">탭하면 전체 대화문 공개</div>';
    } else {
      h+='<div style="width:100%">';
      lines.forEach(function(l){
        h+='<div style="display:flex;gap:8px;padding:5px 0;border-bottom:0.5px solid var(--bbr);text-align:left">';
        h+='<span style="font-size:13px;font-weight:600;color:'+(l.s==='A'?'var(--b)':'var(--y)')+';min-width:16px">'+l.s+'</span>';
        h+='<span style="font-size:13px;line-height:1.5">'+esc(l.e)+'</span></div>';
      });
      h+='</div>';
    }
    h+='</div>';
    if(G.revRevealed){
      h+='<button class="btn pr wr" onclick="G.revStep=2;G.revChecked=[];rend()">몰랐던 문장 체크하기 →</button>';
    }
  }

  // STEP 2: Check lines
  if(G.revStep===2){
    h+='<div style="font-size:14px;font-weight:600;margin-bottom:6px">몰랐던 문장을 체크하세요</div>';
    h+='<div style="font-size:13px;color:var(--text2);margin-bottom:12px">기억 못했던 문장을 체크하면 집중 반복 연습해드려요</div>';
    lines.forEach(function(l,i){
      var chk=G.revChecked.indexOf(i)>=0;
      var safe=l.e.replace(/\\/g,'\\\\').replace(/'/g,"\\'");
      h+='<div class="chk-line'+(chk?' checked':'')+'" onclick="var idx=G.revChecked.indexOf('+i+');if(idx>=0)G.revChecked.splice(idx,1);else G.revChecked.push('+i+');rend()">';
      h+='<div class="chk-box">'+(chk?'✗':'')+'</div>';
      h+='<div style="flex:1">';
      h+='<div style="font-size:12px;font-weight:600;color:'+(l.s==='A'?'var(--b)':'var(--y)')+';margin-bottom:2px">'+l.s+'</div>';
      h+='<div class="chk-text">'+esc(l.e)+'</div></div>';
      h+='<button class="chk-spk" onclick="event.stopPropagation();spk(\''+safe+'\',spd,null)" title="듣기">🔊</button>';
      h+='</div>';
    });
    h+='<div style="display:flex;gap:8px;margin-top:8px">';
    h+='<button class="btn wr" onclick="G.revChecked=[];G.revStep=4;G.revConvRole=null;G.revConvStarted=false;G.revConvDone=false;rend()">모두 알아요 → 롤플레이</button>';
    h+='<button class="btn pr wr" onclick="if(G.revChecked.length>0){saveMissedLines(G.reviewItem.chId,G.revChecked);G.revStep=3;rend();}else{G.revStep=4;G.revConvRole=null;G.revConvStarted=false;rend()}">'+(G.revChecked.length>0?G.revChecked.length+'개 집중 연습':'다음 →')+'</button>';
    h+='</div>';
  }

  // STEP 3: Loop missed lines
  if(G.revStep===3){
    var missed=G.revChecked.map(function(i){return lines[i];});
    h+='<div style="font-size:14px;font-weight:600;margin-bottom:6px">체크한 문장 집중 연습</div>';
    h+='<div style="font-size:13px;color:var(--text2);margin-bottom:10px">'+missed.length+'개 문장을 무한반복으로 익혀요</div>';
    missed.forEach(function(l,i){
      var safe=l.e.replace(/\\/g,'\\\\').replace(/'/g,"\\'");
      h+='<div class="card hi-line" style="margin-bottom:6px">';
      h+='<div style="font-size:12px;font-weight:600;color:'+(l.s==='A'?'var(--b)':'var(--y)')+';margin-bottom:4px">'+l.s+'</div>';
      h+='<div style="font-size:15px;font-weight:500;margin-bottom:8px">'+esc(l.e)+'</div>';
      h+=aBarH(l.e);
      h+='</div>';
    });
    h+='<button class="btn pr wr" style="margin-top:4px" onclick="stopLoop();G.revStep=4;G.revConvRole=null;G.revConvStarted=false;G.revConvDone=false;rend()">롤플레이 도전 →</button>';
  }

  // STEP 4: Roleplay
  if(G.revStep===4){
    if(!G.revConvStarted){
      h+='<div style="font-size:14px;font-weight:600;margin-bottom:6px">롤플레이로 마무리</div>';
      h+='<div style="font-size:13px;color:var(--text2);margin-bottom:12px">내 차례에는 직접 소리내어 말하고 버튼을 눌러요. 상대방 차례는 음성이 자동으로 나와요.</div>';
      h+='<div style="display:flex;gap:8px;margin-bottom:12px">';
      ['A','B'].forEach(function(r){
        h+='<div style="flex:1;padding:12px;border:'+(G.revConvRole===r?'2px solid var(--acc)':'1px solid var(--border)')+';border-radius:var(--rad);cursor:pointer;text-align:center;background:'+(G.revConvRole===r?'var(--bg2)':'var(--bg)')+'" onclick="G.revConvRole=\''+r+'\';rend()">';
        h+='<div style="font-size:22px;margin-bottom:3px">'+(r==='A'?'🙋':'🤖')+'</div>';
        h+='<div style="font-size:14px;font-weight:600">역할 '+r+'</div></div>';
      });
      h+='</div>';
      h+='<button class="btn pr wr" '+(G.revConvRole?'onclick="startConv(G.revConvRole,getCh(G.reviewItem.chId).dlg,true)"':'disabled')+'>▶ 롤플레이 시작</button>';
    } else if(G.revConvDone){
      h+='<div class="card gr" style="text-align:center">';
      h+='<div style="font-size:30px;margin-bottom:8px">🎉</div>';
      h+='<div style="font-size:16px;font-weight:600;margin-bottom:4px">복습 완료!</div>';
      h+='<div style="font-size:13px;color:var(--g)">다음 복습은 자동으로 예약됩니다</div></div>';
      h+='<div style="display:flex;gap:8px;margin-top:10px">';
      h+='<button class="btn wr" onclick="stopLoop();G.reviewItem=null;G.revStep=0;rend()">복습 목록으로</button>';
      var nextDue=getReviewsDue();
      if(nextDue.length>0){h+='<button class="btn pr wr" onclick="G.reviewSection=\'dialogue\';G.reviewItem=getReviewsDue()[0];G.revStep=1;G.revRevealed=false;G.revChecked=[];rend()">다음 복습 →</button>';}
      h+='</div>';
    } else {
      h+=convUI(true);
    }
  }

  // STEP 5: Done
  if(G.revStep===5){
    h+='<div class="lc2"><div style="font-size:40px;margin-bottom:10px">🎊</div>';
    h+='<div style="font-size:18px;font-weight:700;margin-bottom:6px">복습 완료!</div>';
    h+='<div style="font-size:13px;color:var(--text2);margin-bottom:14px">에빙하우스 복습 1회 완료!<br>기억이 오래 유지될 거예요.</div>';
    h+='<button class="btn pr" onclick="stopLoop();G.reviewItem=null;G.revStep=0;rend()">복습 목록으로</button></div>';
  }

  document.getElementById('src').innerHTML=h;
}

    h+='<div style="font-size:12px;color:var(--text2);margin-bottom:8px">새 대화는 학습 탭 맨 위 "내가 직접 대화 추가하기"에서 추가할 수 있어요.</div>';

  h+='<div style="font-size:13px;font-weight:600;color:var(--text2);margin:16px 0 10px;text-transform:uppercase;letter-spacing:.05em">에빙하우스 복습 주기</div>';
  h+='<div class="card"><div style="display:flex;gap:6px">';
  [{l:'학습일',c:'var(--acc)',tc:'var(--act)'},{l:'1일 후',c:'var(--ybg)',tc:'var(--y)'},{l:'3일 후',c:'var(--bbg)',tc:'var(--b)'},{l:'7일 후',c:'#fdf4ff',tc:'#9333ea'},{l:'30일 후',c:'var(--gbg)',tc:'var(--g)'}].forEach(function(s){
    h+='<div style="flex:1;padding:8px 3px;border-radius:var(--rads);background:'+s.c+';text-align:center"><div style="font-size:11px;font-weight:600;color:'+s.tc+'">'+s.l+'</div></div>';
  });
  h+='</div><div style="font-size:12px;color:var(--text2);margin-top:8px;line-height:1.6">학습 후 1일, 3일, 7일, 30일 후에 자동으로 복습 알림이 떠요.<br>4번 모두 완료하면 장기 기억으로 저장됩니다.</div></div>';
  h+='<div style="font-size:13px;font-weight:600;color:var(--text2);margin:16px 0 10px;text-transform:uppercase;letter-spacing:.05em">아이폰 자동 실행</div>';

    h+='<div style="display:flex;gap:10px;padding:6px 0;border-bottom:1px solid var(--bbr)"><span style="font-size:12px;font-weight:600;color:var(--b);min-width:16px">'+(i+1)+'</span><span style="font-size:13px">'+s+'</span></div>';
  });
  h+='</div>';

}

// ── ADD YOUR OWN DIALOGUE ──
function rAdd(){
  var h='';
  h+='<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px">';
  h+='<div style="font-size:20px;font-weight:700">✏️ 대화 직접 추가</div>';
  h+='<button class="btn" onclick="G.showAdd=false;rend()">← 취소</button></div>';

  h+='<div style="background:var(--bg2);border:1px solid var(--border);border-radius:var(--rads);padding:10px 12px;font-size:12px;color:var(--text2);line-height:1.7;margin-bottom:14px">';
  h+='<strong style="color:var(--text)">사용법</strong><br>';
  h+='① <a href="https://www.eslfast.com/easydialogs/" target="_blank" rel="noopener" style="color:var(--b)">eslfast.com</a> 등에서 마음에 드는 대화를 복사<br>';
  h+='② 아래 대화 내용 칸에 붙여넣기 (한 줄에 한 문장)<br>';
  h+='③ "A: " / "B: " 로 시작하면 자동 인식, 없으면 한 줄씩 번갈아 A·B로 나눠줘요<br>';
  h+='④ 미리보기로 확인하고 저장!';
  h+='</div>';

  h+='<div class="card">';
  h+='<div style="font-size:12px;font-weight:600;color:var(--text2);margin-bottom:6px">대화 제목 (한글) *</div>';
  h+='<input class="tinp" id="addTitleKo" placeholder="예: 27강 — 날씨에 대해 이야기할 때" style="margin-bottom:12px">';
  h+='<div style="font-size:12px;font-weight:600;color:var(--text2);margin-bottom:6px">영어 제목 (선택)</div>';
  h+='<input class="tinp" id="addTitleEn" placeholder="예: How is the weather?" style="margin-bottom:12px">';
  h+='<div style="font-size:12px;font-weight:600;color:var(--text2);margin-bottom:6px">대화 내용 (영어, 한 줄에 한 문장) *</div>';
  h+='<textarea class="tinp" id="addRaw" rows="10" style="resize:vertical;font-family:inherit;line-height:1.6" placeholder="A: How is the weather today?\nB: It is sunny and warm.\nA: Do you like sunny days?\nB: Yes, I love them." oninput="previewAdd()"></textarea>';
  h+='</div>';

  h+='<div class="card" id="addPreview" style="min-height:40px"><div style="font-size:12px;color:var(--text3)">대화 내용을 붙여넣으면 여기에 미리보기가 나와요.</div></div>';

  h+='<button class="btn pr wr" onclick="addCustomChapter()">저장하기</button>';

  document.getElementById('sec').innerHTML=h;
}
